# Clean localhost stack — backend + frontend + db, all bound to 127.0.0.1.
# No subnet / LAN networking. Browser reaches the API at http://localhost:8000.
#
# Bring up:  docker compose up -d --build
# Tear down: docker compose down
# Logs:      docker compose logs -f

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://accounting:accounting@db:3306/accounting_automation
      FRONTEND_URL: http://localhost:3000
    volumes:
      - attachments:/app/data/attachments
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Browser-side calls (NEXT_PUBLIC_*) hit the host-mapped port; the
      # server-side /api rewrite uses the in-network service name.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: accounting_automation
      MYSQL_USER: accounting
      MYSQL_PASSWORD: accounting
    # No host port — MySQL stays on the docker network only.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uaccounting", "-paccounting"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql_data:
  attachments:
