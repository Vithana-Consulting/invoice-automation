  # ---- Bank Details ----
  /api/bank-details:
    get:
      tags: [Bank Details]
      summary: List bank details extracted from invoices
      operationId: listBankDetails
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 100 }
      responses:
        '200':
          description: Bank details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      total: { type: integer }
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            invoice_id: { type: integer }
                            invoice_number: { type: string }
                            vendor_name: { type: string }
                            invoice_date: { type: string }
                            bank_name: { type: string, nullable: true }
                            account_number: { type: string, nullable: true }
                            ifsc_code: { type: string, nullable: true }
                            branch: { type: string, nullable: true }
                            account_holder: { type: string, nullable: true }
                            upi_id: { type: string, nullable: true }

  /api/bank-details/export:
    get:
      tags: [Bank Details]
      summary: Export bank details to Excel
      operationId: exportBankDetails
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

