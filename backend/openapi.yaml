openapi: 3.0.3
info:
  title: Vithana Accounting Automation Platform
  description: |
    Invoice Pipeline with Rule Builder — multi-tenant accounting automation for Zoho, Tally, and QuickBooks.

    ## Authentication
    - **Tenant routes** require a JWT `access_token` cookie (obtained via `/api/auth/google/callback`).
    - **Admin routes** require the `x-admin-key` header.
    - **Settings routes** require JWT.

    ## Response envelope
    All responses follow:
    ```json
    { "status": "success" | "error", "data": {}, "message": "..." }
    ```
  version: "0.2.0"
  contact:
    email: Deepak.sakthi@vithanaconsulting.com

servers:
  - url: http://localhost:8000
    description: Local dev

tags:
  - name: Health
  - name: Auth
  - name: Ingest
  - name: Drafts
  - name: Rules
  - name: Vendor Mappings
  - name: Integrations
  - name: Dashboard
  - name: Settings
  - name: COA
  - name: Bank Details
  - name: Admin

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    adminKey:
      type: apiKey
      in: header
      name: x-admin-key

  # ---------------------------------------------------------------------------
  # Reusable schemas
  # ---------------------------------------------------------------------------
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        data:
          description: Payload — shape varies per endpoint

    ErrorEnvelope:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        code:
          type: string

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ---- Auth ----
    Company:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        oauth_configured: { type: boolean }

    UserProfile:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        picture_url: { type: string }
        is_admin: { type: boolean }
        companies:
          type: array
          items: { $ref: '#/components/schemas/UserCompany' }
        active_company:
          $ref: '#/components/schemas/UserCompany'
          nullable: true

    UserCompany:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        domain: { type: string }
        role: { type: string }

    # ---- Draft ----
    LineItem:
      type: object
      properties:
        description: { type: string }
        quantity: { type: number, nullable: true }
        unit_price: { type: number, nullable: true }
        amount: { type: number, nullable: true }
        hsn_code: { type: string, nullable: true }
        tax_rate: { type: number, nullable: true }

    Draft:
      type: object
      properties:
        id: { type: integer }
        invoice_id: { type: integer }
        vendor_name: { type: string }
        resolved_vendor_name: { type: string }
        invoice_number: { type: string }
        invoice_date: { type: string, format: date, nullable: true }
        due_date: { type: string, format: date, nullable: true }
        total_amount: { type: number, nullable: true }
        tax_amount: { type: number, nullable: true }
        currency: { type: string }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        source: { type: string, enum: [gmail, stripe, chargebee, manual_upload] }
        push_to: { type: string, nullable: true }
        push_to_rule_id: { type: integer, nullable: true }
        status:
          type: string
          enum: [PENDING_REVIEW, PENDING_VENDOR, APPROVED, PUSHED, PUSH_FAILED, REJECTED]
        reviewed_by: { type: integer, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        push_error: { type: string, nullable: true }
        pushed_at: { type: string, format: date-time, nullable: true }
        external_bill_id: { type: string, nullable: true }
        validation_warnings:
          type: array
          items: { type: object }
        validation_errors:
          type: array
          items: { type: object }
        tax_breakup: { type: object, nullable: true }
        invoice_type: { type: string }
        account_id: { type: integer, nullable: true }
        account_name: { type: string, nullable: true }
        itc_status: { type: string }
        tds_applicable: { type: boolean }
        place_of_supply: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    DraftUpdate:
      type: object
      properties:
        vendor_name: { type: string }
        resolved_vendor_name: { type: string }
        invoice_number: { type: string }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        total_amount: { type: number }
        tax_amount: { type: number }
        currency: { type: string }
        push_to: { type: string }

    PushOverrideBody:
      type: object
      properties:
        override_reason_code:
          type: string
          enum:
            - AMOUNT_VERIFIED_MANUALLY
            - DUPLICATE_CONFIRMED_DIFFERENT
            - GSTIN_CONFIRMED_VALID
            - RCM_CONFIRMED_NOT_APPLICABLE
            - ITC_CUTOFF_CONFIRMED_WITHIN_LIMIT
            - GST_ROUTING_CONFIGURED_SEPARATELY
            - OTHER
        override_reason: { type: string }

    ValidationBlock:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        detail: { type: object }

    # ---- Rule ----
    RuleConditions:
      type: object
      description: Flexible condition object (vendor_name, amount_gt, amount_lt, source, currency, etc.)
      additionalProperties: true

    Rule:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        priority: { type: integer }
        is_active: { type: boolean }
        conditions: { $ref: '#/components/schemas/RuleConditions' }
        action_type: { type: string }
        action_value: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    RuleCreate:
      type: object
      required: [name, conditions, action_type, action_value]
      properties:
        name: { type: string }
        description: { type: string }
        priority: { type: integer }
        is_active: { type: boolean, default: true }
        conditions: { $ref: '#/components/schemas/RuleConditions' }
        action_type: { type: string }
        action_value: { type: string }

    RuleUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        priority: { type: integer }
        is_active: { type: boolean }
        conditions: { $ref: '#/components/schemas/RuleConditions' }
        action_type: { type: string }
        action_value: { type: string }

    # ---- Vendor Mapping ----
    VendorMapping:
      type: object
      properties:
        id: { type: integer }
        alias_name: { type: string }
        canonical_name: { type: string }
        platform: { type: string }
        platform_vendor_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    VendorMappingCreate:
      type: object
      required: [alias_name, canonical_name, platform]
      properties:
        alias_name: { type: string, maxLength: 500 }
        canonical_name: { type: string, maxLength: 500 }
        platform: { type: string, maxLength: 50 }
        platform_vendor_id: { type: string }

    # ---- Integration ----
    Integration:
      type: object
      properties:
        id: { type: integer, nullable: true }
        platform: { type: string }
        display_name: { type: string }
        description: { type: string }
        category: { type: string }
        is_enabled: { type: boolean }
        is_configured: { type: boolean }
        health_status: { type: string }
        health_checked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

    IntegrationCreate:
      type: object
      required: [platform, config]
      properties:
        platform: { type: string }
        display_name: { type: string }
        config: { type: object }
        is_enabled: { type: boolean, default: false }

    # ---- COA ----
    COAAccount:
      type: object
      properties:
        id: { type: integer }
        platform: { type: string }
        platform_account_id: { type: string }
        code: { type: string }
        name: { type: string }
        type: { type: string }
        description: { type: string }
        parent_platform_id: { type: string, nullable: true }
        is_active: { type: boolean }
        sub_type:
          type: string
          nullable: true
          enum: [PURCHASE, SALE, TAX_CGST, TAX_SGST, TAX_IGST, TAX_CESS, null]
        hsn_codes:
          type: array
          items: { type: string }
        is_default: { type: boolean }
        synced_at: { type: string, format: date-time, nullable: true }

    # ---- Admin ----
    AdminCompany:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        domain: { type: string }
        is_active: { type: boolean }
        oauth_configured: { type: boolean }
        members:
          type: array
          items:
            type: object
            properties:
              email: { type: string }
              role: { type: string }
        created_at: { type: string, format: date-time, nullable: true }

    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        entity_type: { type: string }
        entity_id: { type: integer }
        action: { type: string }
        details: { type: object, nullable: true }
        status: { type: string }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

# ===========================================================================
# Paths
# ===========================================================================
paths:

  # ---- Health ----
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, degraded] }
                  app: { type: string }
                  database: { type: string, enum: [healthy, error] }
                  parser_mode: { type: string }
                  llm_provider: { type: string, nullable: true }
                  llm_model: { type: string, nullable: true }
                  timestamp: { type: string, format: date-time }

  /config:
    get:
      tags: [Health]
      summary: App runtime config (non-sensitive)
      operationId: getConfig
      responses:
        '200':
          description: Runtime config values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  # ---- Auth ----
  /api/auth/companies:
    get:
      tags: [Auth]
      summary: List companies (for login selector)
      operationId: listCompanies
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search term
      responses:
        '200':
          description: List of companies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Company' }

  /api/auth/login-by-email:
    post:
      tags: [Auth]
      summary: Initiate login by user email (auto-selects company)
      operationId: loginByEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Redirect URL for OAuth
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          redirect_url: { type: string }
                          company: { type: string }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Initiate login by company slug
      operationId: loginBySlug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_slug]
              properties:
                company_slug: { type: string }
      responses:
        '200':
          description: Redirect URL for OAuth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback — sets access_token cookie
      operationId: googleCallback
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect to frontend with auth cookie set

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear auth cookie
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ---- Ingest ----
  /api/ingest/preflight:
    get:
      tags: [Ingest]
      summary: Preflight check (validate credentials before ingest)
      operationId: ingestPreflight
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Preflight result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          success: { type: boolean }
                          warnings: { type: array, items: { type: object } }
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                message: { type: string }

  /api/ingest/{source}:
    post:
      tags: [Ingest]
      summary: Run ingest pipeline from a source
      operationId: runIngest
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
            enum: [gmail, stripe, chargebee]
      responses:
        '200':
          description: Ingest result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoices_fetched: { type: integer }
                          invoices_parsed: { type: integer }
                          drafts_created: { type: integer }
                          pipeline_warnings: { type: array, items: { type: object } }

  /api/ingest/upload/file:
    post:
      tags: [Ingest]
      summary: Upload a single invoice file (PDF, JPG, PNG, TIFF, BMP)
      operationId: uploadInvoiceFile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Upload result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoice_id: { type: integer }
                          parsed: { type: boolean }
                          draft_id: { type: integer, nullable: true }
                          duplicate: { type: boolean }

  /api/ingest/reparse/{invoice_id}:
    post:
      tags: [Ingest]
      summary: Reparse a single invoice
      operationId: reparseInvoice
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: invoice_id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Reparse result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/ingest/reparse-all:
    post:
      tags: [Ingest]
      summary: Reparse all invoices in batch
      operationId: reparseAll
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 100 }
      responses:
        '200':
          description: Batch reparse results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total: { type: integer }
                          success: { type: integer }
                          failed: { type: integer }
                          results:
                            type: array
                            items:
                              type: object
                              properties:
                                invoice_id: { type: integer }
                                file_name: { type: string }
                                success: { type: boolean }
                                vendor_name: { type: string, nullable: true }
                                total_amount: { type: number, nullable: true }
                                error: { type: string, nullable: true }

  # ---- Drafts ----
  /api/drafts:
    get:
      tags: [Drafts]
      summary: List invoice drafts
      operationId: listDrafts
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING_REVIEW, PENDING_VENDOR, APPROVED, PUSHED, PUSH_FAILED, REJECTED]
        - in: query
          name: push_to
          schema: { type: string, enum: [zoho, tally, quickbooks] }
        - in: query
          name: source
          schema: { type: string, enum: [gmail, stripe, chargebee, manual_upload] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated draft list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Draft' }

  /api/drafts/export:
    get:
      tags: [Drafts]
      summary: Export drafts to Excel
      operationId: exportDrafts
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: push_to
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
      responses:
        '200':
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/drafts/bulk-approve:
    post:
      tags: [Drafts]
      summary: Bulk approve drafts (max 500)
      operationId: bulkApproveDrafts
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_ids]
              properties:
                draft_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 500
      responses:
        '200':
          description: Approval results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/drafts/bulk-push:
    post:
      tags: [Drafts]
      summary: Bulk push drafts (max 500)
      operationId: bulkPushDrafts
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_ids]
              properties:
                draft_ids:
                  type: array
                  items: { type: integer }
                  maxItems: 500
      responses:
        '200':
          description: Push results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            draft_id: { type: integer }
                            success: { type: boolean }
                            error: { type: string }
                            external_bill_id: { type: string }
                            validation_blocks:
                              type: array
                              items: { $ref: '#/components/schemas/ValidationBlock' }

  /api/drafts/resolve-vendors:
    post:
      tags: [Drafts]
      summary: Re-run vendor resolution on all pending drafts
      operationId: resolveVendors
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Resolution result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/drafts/apply-rules:
    post:
      tags: [Drafts]
      summary: Apply routing rules to drafts
      operationId: applyRules
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                draft_ids:
                  type: array
                  items: { type: integer }
                  description: If omitted, applies to all eligible drafts
      responses:
        '200':
          description: Rule application results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          matched: { type: integer }
                          skipped: { type: integer }
                          results:
                            type: array
                            items:
                              type: object
                              properties:
                                draft_id: { type: integer }
                                vendor: { type: string }
                                rule_name: { type: string }
                                push_to: { type: string }

  /api/drafts/{draft_id}:
    get:
      tags: [Drafts]
      summary: Get a single draft
      operationId: getDraft
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: draft_id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Draft object
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Draft' }
        '404':
          description: Draft not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    put:
      tags: [Drafts]
      summary: Update a draft
      operationId: updateDraft
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: draft_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftUpdate' }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/drafts/{draft_id}/reparse:
    post:
      tags: [Drafts]
      summary: Reparse a draft's source invoice
      operationId: reparseDraft
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: draft_id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Refreshed draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/drafts/{draft_id}/approve:
    post:
      tags: [Drafts]
      summary: Approve a draft
      operationId: approveDraft
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: draft_id
          required: true
