      operationId: syncCOA
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: platform
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/coa/auto-tag/{platform}:
    post:
      tags: [COA]
      summary: Auto-tag accounts by keyword heuristics
      operationId: autoTagCOA
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: platform
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Auto-tag result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

  /api/coa/{account_id}:
    put:
      tags: [COA]
      summary: Tag / configure a COA account
      operationId: updateCOA
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sub_type:
                  type: string
                  enum: [PURCHASE, SALE, TAX_CGST, TAX_SGST, TAX_IGST, TAX_CESS]
                hsn_codes:
                  type: array
                  items: { type: string }
                is_default: { type: boolean }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }

