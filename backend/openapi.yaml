        - cookieAuth: []
      parameters:
        - in: path
          name: draft_id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushOverrideBody' }
      responses:
        '200':
          description: Pushed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          draft_id: { type: integer }
